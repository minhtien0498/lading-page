apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-html
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-html
  template:
    metadata:
      labels:
        app: web-html
    spec:
      containers:
        - name: web-html
          image: my-html-web:latest
          imagePullPolicy: Never      # Không pull image từ Docker Hub, dùng image đã load vào kind
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web-html-service
spec:
  type: NodePort
  selector:
    app: web-html
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30001
